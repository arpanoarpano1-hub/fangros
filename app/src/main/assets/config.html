<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Aegis Guard Setup</title>
  <style>
    :root {
      --bg: #11100e;
      --card: #181714;
      --field: #211f1b;
      --line: #2d2a25;
      --ink: #edeae4;
      --dim: #9a948a;
      --copper: #c87d55;
      --sage: #6b9080;
      --crimson: #c25959;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background: var(--bg); color: var(--ink); padding: 16px 14px 36px; line-height: 1.45; }
    .wrap { max-width: 440px; margin: 0 auto; }
    .head { padding: 4px 2px 16px; border-bottom: 1px solid #24211d; margin-bottom: 14px; }
    .head h1 { font-size: 1.05rem; font-weight: 700; }
    .head p { font-size: 0.75rem; color: var(--dim); margin-top: 2px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .step-tag { font-size: 0.72rem; font-weight: 600; color: var(--copper); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 10px; display: block; }
    .perm-btn {
      width: 100%; padding: 11px 12px; margin-bottom: 8px; border-radius: 8px;
      background: var(--field); border: 1px solid var(--line); color: var(--ink);
      font-size: 0.82rem; font-weight: 500; text-align: left; cursor: pointer;
      display: flex; justify-content: space-between; align-items: center;
    }
    .perm-btn:last-child { margin-bottom: 0; }
    .perm-btn span { font-size: 0.72rem; color: var(--copper); font-weight: 600; }
    .code-box {
      display: flex; gap: 8px; align-items: center; margin-bottom: 10px;
    }
    .code-input {
      flex: 1; background: var(--field); border: 1px solid var(--line); border-radius: 9px;
      padding: 12px; color: var(--ink); font-size: 1.35rem; font-weight: 700;
      letter-spacing: 0.22em; text-align: center; outline: none;
    }
    .code-input:focus { border-color: var(--copper); }
    .copy-btn {
      padding: 14px 14px; border-radius: 9px; background: var(--field);
      border: 1px solid var(--line); color: var(--ink); font-size: 0.78rem; font-weight: 600; cursor: pointer;
    }
    .hint { font-size: 0.73rem; color: var(--dim); margin-bottom: 12px; }
    .btn-main {
      width: 100%; padding: 13px; border-radius: 9px; border: none;
      background: var(--sage); color: #11100e; font-size: 0.88rem; font-weight: 700; cursor: pointer;
    }
    .btn-stop {
      width: 100%; padding: 10px; border-radius: 9px; margin-top: 8px;
      background: rgba(194, 89, 89, 0.14); border: 1px solid rgba(194, 89, 89, 0.35);
      color: #e08a8a; font-size: 0.8rem; font-weight: 600; cursor: pointer;
    }
    label { display: block; font-size: 0.74rem; color: var(--dim); margin: 10px 0 5px; }
    input[type="text"], textarea {
      width: 100%; background: var(--field); border: 1px solid var(--line); border-radius: 8px;
      padding: 10px 11px; color: var(--ink); font-size: 0.83rem; outline: none;
    }
    textarea { min-height: 58px; resize: vertical; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <h1>Aegis Guard</h1>
      <p>Siapkan izin lalu tekan Hubungkan</p>
    </div>

    <div class="card">
      <span class="step-tag">1. Aktifkan Izin Wajib</span>
      <button class="perm-btn" onclick="AndroidBridge.requestBasicPerms()">
        Kamera, Lokasi, Mic &amp; SMS <span>Izinkan &rarr;</span>
      </button>
      <button class="perm-btn" onclick="AndroidBridge.requestOverlayPerm()">
        Tampil di Atas Aplikasi Lain <span>Izinkan &rarr;</span>
      </button>
      <button class="perm-btn" onclick="AndroidBridge.requestDeviceAdmin()">
        Anti-Uninstall (Admin Perangkat) <span>Aktifkan &rarr;</span>
      </button>
      <button class="perm-btn" onclick="AndroidBridge.openAccessibility()">
        Proteksi Tombol Daya (Opsional) <span>Buka &rarr;</span>
      </button>
    </div>

    <div class="card">
      <span class="step-tag">2. Kode Koneksi Perangkat</span>
      <div class="code-box">
        <input id="pairCode" class="code-input" type="text" maxlength="12" placeholder="123456" />
        <button class="copy-btn" onclick="copyNow()">Salin</button>
      </div>
      <p class="hint">Masukkan kode 6 digit di atas ke Web Controller agar kedua HP langsung terhubung.</p>

      <button class="btn-main" onclick="startNow()">SIMPAN &amp; HUBUNGKAN SEKARANG</button>
      <button class="btn-stop" onclick="AndroidBridge.stopGuard()">Matikan Penjagaan</button>
    </div>

    <div class="card">
      <span class="step-tag">Pengaturan Tambahan (Opsional)</span>
      <label>Nomor HP Cadangan (Tombol Telepon Darurat)</label>
      <input id="backupPhone" type="text" placeholder="Contoh: 081234567890" />
      <label>Pesan Layar Mode Hilang</label>
      <textarea id="lostMsg">HP ini dilindungi Aegis Guard. Mohon hubungi pemilik untuk mengembalikan.</textarea>
    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      try {
        const cfg = JSON.parse(AndroidBridge.getState());
        if (cfg.code) document.getElementById('pairCode').value = cfg.code;
        if (cfg.backupPhone) document.getElementById('backupPhone').value = cfg.backupPhone;
        if (cfg.lostMsg) document.getElementById('lostMsg').value = cfg.lostMsg;
      } catch (_) {}
    });

    function copyNow() {
      const code = document.getElementById('pairCode').value.trim();
      if (code) AndroidBridge.copyCode(code);
    }

    function startNow() {
      const code = document.getElementById('pairCode').value.trim();
      const phone = document.getElementById('backupPhone').value.trim();
      const msg = document.getElementById('lostMsg').value.trim();
      AndroidBridge.connectAndStart(code, phone, msg);
    }
  </script>
</body>
</html>
